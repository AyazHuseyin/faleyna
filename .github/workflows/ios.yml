# iOS: GitHub Actions (macOS runner)
# Simülatör derlemesi — imza yok (CI doğrulaması)

name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Xcode build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Gemfile + bundle exec bazen GHA Ruby ile uyumsuz kalıyor; doğrudan CocoaPods kullan
      - name: Install CocoaPods
        run: sudo gem install cocoapods -N

      - name: Pod install
        working-directory: ios
        run: pod install
        env:
          LANG: en_US.UTF-8

      - name: Xcode build (Simulator, no code signing)
        run: |
          set -o pipefail
          export NODE_BINARY="$(command -v node)"
          echo "NODE_BINARY=$NODE_BINARY"
          node -v
          xcodebuild -version
          xcodebuild \
            -workspace ios/faleyna.xcworkspace \
            -scheme faleyna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Upload Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
