# iOS: GitHub Actions (macOS runner)
# - Her push/PR'da simülatör derlemesi (imza gerektirmez, CI doğrulaması)
# - Gerçek .ipa / TestFlight için ayrıca Apple sertifikası + profil veya App Store Connect API gerekir

name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Xcode build (iOS Simulator)
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Install Ruby gems (CocoaPods)
        run: |
          gem install bundler
          bundle install

      - name: Pod install
        working-directory: ios
        run: bundle exec pod install
        env:
          LANG: en_US.UTF-8

      - name: Xcode build (Simulator, no code signing)
        run: |
          xcodebuild \
            -workspace ios/faleyna.xcworkspace \
            -scheme faleyna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            build
