# iOS: GitHub Actions (macOS runner)
# Simülatör derlemesi — imza yok (CI doğrulaması)

name: iOS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-simulator:
    name: Xcode build (iOS Simulator)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # EAS production ile aynı (eas.json node: 20.18.1)
          node-version: '20.18.1'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      # Gemfile + bundle exec bazen GHA Ruby ile uyumsuz kalıyor; doğrudan CocoaPods kullan
      - name: Install CocoaPods
        run: sudo gem install cocoapods -N

      - name: Pod install
        working-directory: ios
        run: pod install
        env:
          LANG: en_US.UTF-8
          RCT_NEW_ARCH_ENABLED: '0'

      - name: Xcode build (Simulator, no code signing)
        env:
          RCT_NO_LAUNCH_PACKAGER: '1'
          RCT_NEW_ARCH_ENABLED: '0'
          NODE_OPTIONS: '--max-old-space-size=6144'
        run: |
          set -o pipefail
          export NODE_BINARY="$(command -v node)"
          echo "NODE_BINARY=$NODE_BINARY"
          node -v
          xcodebuild -version
          LOG="${RUNNER_TEMP}/xcodebuild.log"
          ERR="${RUNNER_TEMP}/xcode-errors.txt"
          # GHA bash -e: pipefail ile xcodebuild kırılınca sonraki satırlar çalışmaz; önce +e ile çıkış kodunu yakala
          set +e
          xcodebuild \
            -workspace ios/faleyna.xcworkspace \
            -scheme faleyna \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -jobs 1 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build 2>&1 | tee "$LOG"
          XCODE_EXIT=${PIPESTATUS[0]}
          set -e
          echo ""
          echo "========== xcodebuild çıkış: $XCODE_EXIT (log: $LOG) =========="
          grep -E "error: |fatal error:|BUILD FAILED|The following build commands failed|Undefined symbols|clang: error|ld: |Swift Compiler Error|SwiftEmitModule failed|nonzero exit code|INTERNAL ERROR" "$LOG" 2>/dev/null | tail -n 150 > "$ERR" || true
          if [ -s "$ERR" ]; then
            echo "========== Hata satırları (grep) =========="
            cat "$ERR"
          else
            echo "(grep ile eşleşen hata satırı yok — aşağıda log sonu)"
          fi
          echo "========== Log sonu 100 satır =========="
          tail -n 100 "$LOG"
          exit "$XCODE_EXIT"

      - name: Upload Xcode logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ${{ runner.temp }}/xcodebuild.log
            ${{ runner.temp }}/xcode-errors.txt
          if-no-files-found: ignore
